<div class="login-container">
  <div class="card shadow-sm p-4">
    <h2 class="text-center mb-4">Login</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <!-- Email -->
      <div class="mb-3">
        <label>Email</label>
        <input formControlName="email" type="email" class="form-control" placeholder="Enter email" />
        <div *ngIf="form.controls['email'].invalid && form.controls['email'].touched" class="text-danger small">
          Please enter a valid email
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label>Password</label>
        <input formControlName="password" type="password" class="form-control" placeholder="Enter password" />
        <div *ngIf="form.controls['password'].invalid && form.controls['password'].touched" class="text-danger small">
          Password is required
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

      <!-- Login Button -->
      <button class="btn btn-primary w-100" type="submit" [disabled]="form.invalid">
        Login
      </button>

      <!-- Register Link -->
      <p class="mt-3 text-center">
        Don’t have an account?
        <a routerLink="/register">Register here</a>
      </p>
    </form>
  </div>
</div>
