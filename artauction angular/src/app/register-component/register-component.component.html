<div class="login-container">
  <div class="card shadow-sm p-4">
    <h2 class="text-center mb-4">Register</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
     <!-- Full Name -->
<div class="mb-3">
  <label>Full Name</label>
  <input formControlName="fullName" class="form-control" placeholder="Enter your full name" />
  <div *ngIf="form.controls['fullName'].invalid && form.controls['fullName'].touched"
       class="text-danger small">
    Full name is required
  </div>
</div>


      <!-- Email -->
      <div class="mb-3">
        <label>Email</label>
        <input formControlName="email" type="email" class="form-control" placeholder="Enter email" />
        <div *ngIf="form.controls['email'].invalid && form.controls['email'].touched"
             class="text-danger small">
          Please enter a valid email
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label>Password</label>
        <input formControlName="password" type="password" class="form-control" placeholder="Enter password" />
        <div *ngIf="form.controls['password'].invalid && form.controls['password'].touched"
             class="text-danger small">
          Password is required
        </div>
      </div>

      <!-- Role -->
      <div class="mb-3">
        <label>Role</label>
        <select formControlName="role" class="form-control">
          <option value="">-- Select Role --</option>
          <option value="Artist">Artist</option>
          <option value="Buyer">Buyer</option>
        </select>
        <div *ngIf="form.controls['role'].invalid && form.controls['role'].touched"
             class="text-danger small">
          Please select a role
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

      <!-- Submit -->
      <button class="btn btn-success w-100" type="submit" [disabled]="form.invalid">
        Register
      </button>

      <!-- Login Link -->
      <p class="mt-3 text-center">
        Already have an account?
        <a routerLink="/login">Login here</a>
      </p>
    </form>
  </div>
</div>
